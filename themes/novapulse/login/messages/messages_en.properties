novapulse.login.error.bruteforceTemporary=Too many failed attempts. Try again in a few minutes.
novapulse.login.error.userDisabled=This account is currently inactive.
novapulse.login.error.invalidCredentials=The username or password you entered is incorrect.
novapulse.login.success.hint=Signed in successfully.

# ── Links ──────────────────────────────────────────────────────────────────
