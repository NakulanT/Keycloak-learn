loginTitleHtml=Sign In
loginTitle=Sign in to {0}

# ── Field labels ───────────────────────────────────────────────────────────
username=Username
password=Password
email=Email
rememberMe=Remember me

# ── Validation / error messages ────────────────────────────────────────────
missingUsernameMessage=Please enter your username or email.
missingPasswordMessage=Please enter your password.
invalidUserMessage=Invalid username or password.
accountDisabledMessage=Your account has been disabled. Please contact support.
accountTemporarilyDisabledMessage=Your account is temporarily locked due to too many failed login \
